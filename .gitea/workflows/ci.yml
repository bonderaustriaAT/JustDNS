name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # DuckDB's bundled C++ sources compile into multi-gigabyte objects when
      # debug info is on, which overflows the runner's disk (and /tmp). Drop
      # debug info and incremental artefacts to keep the build within bounds.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # The DuckDB query log is compiled from its bundled C++ sources.
        run: |
          apt-get update
          apt-get install -y g++

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Reuse compiled dependencies across runs. The first run pays the full
      # DuckDB C++ build; later runs restore it and recompile only what changed.
      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/justdns-web/ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/justdns-web/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
