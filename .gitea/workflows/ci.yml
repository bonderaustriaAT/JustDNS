name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Rust stable with a C++ toolchain already present, so the bundled DuckDB
    # build needs no extra setup per run.
    container: rust:1-bookworm
    env:
      # Cap parallel codegen (Rust and the bundled C++) to keep peak memory in
      # reach of a small runner; the Arrow/DuckDB build otherwise risks an OOM.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      # Reuse compiled dependencies across runs. The first run pays the full
      # DuckDB/Arrow C++ build; later runs restore it and recompile only what
      # changed. CARGO_HOME is /usr/local/cargo in this image.
      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rust components
        run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/justdns-web/ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/justdns-web/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
