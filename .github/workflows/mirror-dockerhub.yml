# One-off mirror of an already published app image from ghcr.io to Docker Hub,
# started by hand (workflow_dispatch). The release workflow (image.yml) mirrors
# every new tag automatically; this is for seeding Docker Hub with a version that
# shipped before the mirror existed, or re-copying one on demand. It copies the
# multi-arch manifest registry to registry with buildx imagetools, so nothing is
# rebuilt and the Docker Hub image keeps the exact same digest as ghcr.io.
#
# It reuses the stored secrets (GHCR_PAT to read ghcr, DOCKERHUB_TOKEN to write
# Docker Hub) and only runs when the DOCKERHUB_NAMESPACE variable is set.
name: Mirror image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released version tag to copy, e.g. v0.48.3 (also updates :latest)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  GHCR_IMAGE: ghcr.io/bonderaustriaat/justdns

jobs:
  mirror:
    # Only when the Docker Hub mirror is configured.
    if: ${{ vars.DOCKERHUB_NAMESPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Log in to Docker Hub
        # Username from the secret when set, otherwise the namespace variable.
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy the manifest to Docker Hub
        # Copies every architecture of the source tag in one shot and publishes it
        # under both the version tag and :latest on Docker Hub. imagetools reads the
        # source manifest and writes the target, so there is no rebuild.
        env:
          DH_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/justdns
          VTAG: ${{ inputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "$DH_IMAGE:$VTAG" \
            --tag "$DH_IMAGE:latest" \
            "$GHCR_IMAGE:$VTAG"
