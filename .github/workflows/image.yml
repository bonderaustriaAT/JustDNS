# Build the container images and publish them to the GitHub Container Registry
# (ghcr.io) on a release tag. This is the only place JustDNS images are built:
# the in-app update checks public GitHub tags, and this publishes the matching
# app image and the updater sidecar to ghcr.io so any install can pull them.
# Deployments point JUSTDNS_IMAGE / JUSTDNS_UPDATER_IMAGE here (the compose
# default). GitHub's hosted runners build reliably with a shared layer cache;
# the LAN Gitea registry no longer builds images.
name: Image (ghcr.io)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Serialise image builds so overlapping release tags never run together. Two runs
# that build at once both race the shared :buildcache (each exports mode=max and
# the last writer wins), so one reads a half overwritten cache and rebuilds cold.
# cancel-in-progress is false, so a running release is never aborted: a newer tag
# waits for it and then reuses its warm cache. Caveat: if three or more tags pile
# up within one build window, GitHub supersedes the older pending run, so avoid
# pushing a burst of release tags while a build is still running.
concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # ghcr requires an all-lowercase namespace.
  IMAGE: ghcr.io/bonderaustriaat/justdns

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        # Creating a brand-new package under an organization is denied for the
        # built-in GITHUB_TOKEN, so we log in with a classic PAT (scope
        # write:packages) kept as the repo secret GHCR_PAT. The username is the
        # token owner, i.e. whoever pushed the tag.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Buildx
        # A persistent BuildKit builder, so layers (above all the cargo-chef
        # dependency layer) can be exported to and restored from the cache.
        uses: docker/setup-buildx-action@v3

      - name: Work out the image tags
        # A normal release tag publishes :latest and :vX.Y.Z (the stable channel).
        # A pre-release tag (vX.Y.Z-rc…, i.e. any tag with a '-') publishes :vX.Y.Z
        # and the moving :beta tag, and never moves :latest — so a node on the beta
        # channel pulls :beta while stable installs are untouched.
        # A manual run only warms the cache (push is disabled below).
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            case "${{ github.ref_name }}" in
              *-*) TAGS="$IMAGE:${{ github.ref_name }},$IMAGE:beta" ;;
              *)   TAGS="$IMAGE:latest,$IMAGE:${{ github.ref_name }}" ;;
            esac
          else
            TAGS="$IMAGE:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push JustDNS
        # Layer cache makes repeat builds fast: the heavy dependency layer (DuckDB's
        # bundled C++) is reused, only changed crates rebuild. The cache is a registry
        # image (`:buildcache`), which has no expiry and no size cap. The GitHub Actions
        # (gha) cache is intentionally not used for this image: its 280 MiB plus
        # dependency layer filled the 10 GB per repo cap, whose LRU eviction then kept
        # dropping that very layer (and the sidecar caches below), and exporting it on
        # every run cost extra time for a cache the registry one already covers. Only a
        # real release tag publishes the image; a manual run just builds and warms it.
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.ref_type == 'tag' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Build and push the updater sidecar
        # Version-neutral; always :latest. Same publish rule as above.
        uses: docker/build-push-action@v6
        with:
          context: deploy/updater
          tags: ${{ env.IMAGE }}-updater:latest
          # Version-neutral :latest sidecar: publish only on a real release tag,
          # never on a pre-release (a canary reuses the current :latest sidecar).
          push: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

      - name: Build and push the harvester sidecar
        # The read-only DACH-candidate harvester (crates/justdns-harvester). It is
        # an optional companion, not part of the official install, so it is
        # version-neutral (always :latest) and publishes under the same tag rule.
        # The build context is the repo root because the Dockerfile compiles the
        # crate against the workspace; the lean dependency set keeps the build
        # quick, so a plain gha layer cache is enough (no registry buildcache).
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/justdns-harvester/Dockerfile
          tags: ${{ env.IMAGE }}-harvester:latest
          # Version-neutral :latest sidecar: real release tags only, not canaries.
          push: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
          cache-from: type=gha,scope=harvester
          cache-to: type=gha,mode=max,scope=harvester
