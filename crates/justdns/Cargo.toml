[package]
name = "justdns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
justdns-auth = { path = "../justdns-auth" }
justdns-config = { path = "../justdns-config" }
justdns-dns = { path = "../justdns-dns" }
justdns-filter = { path = "../justdns-filter" }
justdns-lists = { path = "../justdns-lists" }
justdns-rewrite = { path = "../justdns-rewrite" }
justdns-store = { path = "../justdns-store" }
justdns-web = { path = "../justdns-web" }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
