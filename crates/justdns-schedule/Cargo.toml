[package]
name = "justdns-schedule"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
justdns-clients = { path = "../justdns-clients" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2"
# Local-time evaluation of the weekly windows. `clock` gives `Utc::now`; the tz
# database in chrono-tz makes the configured IANA zone DST-correct.
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"

[dev-dependencies]
tempfile = "3.23.0"
