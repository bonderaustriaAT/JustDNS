[package]
name = "justdns-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.6.0"
getrandom = "0.3"
justdns-secret = { path = "../justdns-secret" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2"
totp-rs = { version = "6.0.0", default-features = false, features = ["otpauth", "gen_secret"] }

[dev-dependencies]
tempfile = "3.23.0"
