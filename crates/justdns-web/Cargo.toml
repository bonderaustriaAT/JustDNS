[package]
name = "justdns-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
justdns-rewrite = { path = "../justdns-rewrite" }
axum = "0.8.4"
axum-extra = { version = "0.12", features = ["cookie"] }
justdns-access = { path = "../justdns-access" }
justdns-audit = { path = "../justdns-audit" }
justdns-auth = { path = "../justdns-auth" }
justdns-clients = { path = "../justdns-clients" }
justdns-config = { path = "../justdns-config" }
justdns-dns = { path = "../justdns-dns" }
justdns-filter = { path = "../justdns-filter" }
justdns-geoip = { path = "../justdns-geoip" }
justdns-lists = { path = "../justdns-lists" }
justdns-schedule = { path = "../justdns-schedule" }
justdns-secret = { path = "../justdns-secret" }
justdns-store = { path = "../justdns-store" }
rust-embed = { version = "8.7.2", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.54.1", features = ["net", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
ureq = "3.5"
ring = "0.17"
base64 = "0.23"
# NFS backup transport (optional, Linux-only). libnfs binds the C library libnfs
# and links it dynamically, so it is gated behind the `nfs` feature and only
# compiled for the container image; the default build (and Windows/CI) stays
# free of the native dependency. nix is pinned to the same minor libnfs uses so
# the OFlag/Mode types it takes unify.
libnfs = { version = "0.1.1", optional = true }
# Only to name the OFlag/Mode types libnfs's API takes; libnfs enables the nix
# features that define them, so none are requested here. Pinned to libnfs's minor
# so the types unify.
nix = { version = "0.25", optional = true }

[features]
# Compile the in-process NFS transport. Needs libnfs-dev + libclang at build
# time and libnfs.so at runtime (see the Dockerfile). Off by default.
nfs = ["dep:libnfs", "dep:nix"]

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.2", features = ["util"] }
