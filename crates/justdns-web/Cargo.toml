[package]
name = "justdns-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
justdns-rewrite = { path = "../justdns-rewrite" }
axum = "0.8.4"
axum-extra = { version = "0.10.1", features = ["cookie"] }
justdns-access = { path = "../justdns-access" }
justdns-audit = { path = "../justdns-audit" }
justdns-auth = { path = "../justdns-auth" }
justdns-clients = { path = "../justdns-clients" }
justdns-config = { path = "../justdns-config" }
justdns-dns = { path = "../justdns-dns" }
justdns-filter = { path = "../justdns-filter" }
justdns-lists = { path = "../justdns-lists" }
justdns-schedule = { path = "../justdns-schedule" }
justdns-store = { path = "../justdns-store" }
rust-embed = { version = "8.7.2", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.54.1", features = ["net", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
ureq = "2.12.1"
ring = "0.17"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.2", features = ["util"] }
