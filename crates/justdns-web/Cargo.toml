[package]
name = "justdns-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
justdns-rewrite = { path = "../justdns-rewrite" }
axum = "0.8.4"
axum-extra = { version = "0.10.1", features = ["cookie"] }
justdns-auth = { path = "../justdns-auth" }
justdns-config = { path = "../justdns-config" }
justdns-dns = { path = "../justdns-dns" }
justdns-filter = { path = "../justdns-filter" }
justdns-lists = { path = "../justdns-lists" }
justdns-store = { path = "../justdns-store" }
rust-embed = { version = "8.7.2", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["net", "rt"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.2", features = ["util"] }
